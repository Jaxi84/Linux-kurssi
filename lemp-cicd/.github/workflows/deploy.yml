
name: CI/CD for LEMP Containers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_DIR: lemp-cicd
  SSH_USER: ubuntu
  VM_DEPLOY_PATH: /opt/lemp/cicd   # pidetään tämä, luodaan tarvittaessa

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # (Valinnainen) tänne voi myöhemmin lisätä build & push Docker Hubiin

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure target directory exists and set permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p ${{ env.VM_DEPLOY_PATH }}/db/init/
            sudo chown -R $USER:$USER ${{ env.VM_DEPLOY_PATH }} || true

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml,db/,frontend/,backend/"
          target: ${{ env.VM_DEPLOY_PATH }}

      - name: Write .env on VPS from Secrets (DO NOT commit .env to repo)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ env.VM_DEPLOY_PATH }}
            cat > .env <<EOF
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            EOF
            ls -la .env

      - name: Deploy with Docker Compose v2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ env.VM_DEPLOY_PATH }}
            # V2-syntaksi: docker compose
            docker compose --env-file .env -f docker-compose.prod.yml down
            docker compose --env-file .env -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps

            echo "Running smoke test via Nginx reverse proxy: http://localhost/cicd/health"
            # Odota palvelun käynnistymistä
            for i in $(seq 1 10); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/cicd/health || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Frontend healthy (200 OK)"
                break
              fi
              echo "Waiting for app... ($i)"
              sleep 3
            done

            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ Deployment FAILED: HTTP $HTTP_CODE"
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs frontend
              exit 1
            fi

            echo "✅ Deployment successful. Reloading N            echo "✅ Deployment successful. Reloading Nginx on host."
