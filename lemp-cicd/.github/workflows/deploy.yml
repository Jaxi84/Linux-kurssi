name: CI/CD for LEMP Containers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_DIR: lemp-cicd
  SSH_USER: ubuntu
  VM_DEPLOY_PATH: /opt/lemp/cicd

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # Lisää Build & Push vaiheet tähän kun Node.js/Python koodi on valmis.
      # Toistaiseksi jätetään tyhjäksi, jotta workflow suorittuu (Deploy-vaihe riippuu tästä).
      # Tämä tulee korvaamaan Copy-to-VM -vaiheen.

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure target directory exists and set permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Tarvitaan, jos db/init/init.sql tiedostoja kopioidaan
            sudo mkdir -p ${{ env.VM_DEPLOY_PATH }}/db/init/
            sudo chown -R $USER:$USER ${{ env.VM_DEPLOY_PATH }} || true

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Kopioi compose-tiedostot ja db-alustus
          source: ${{ env.PROJECT_DIR }}/db/init/init.sql,${{ env.PROJECT_DIR }}/docker-compose.prod.yml
          target: ${{ env.VM_DEPLOY_PATH }}

      - name: Run Docker Compose deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ env.VM_DEPLOY_PATH }}
            
            # Määrittele salaisuudet ympäristömuuttujiksi (käytetään pull- ja up-komennoissa)
            SECRETS_ENV="MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
                         DB_USER=${{ secrets.DB_USER }} \
                         DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                         DB_NAME=${{ secrets.DB_NAME }} \
                         DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}"

            # Pysäytä ja poista vanhat palvelut
            $SECRETS_ENV sudo docker-compose -f docker-compose.prod.yml down --remove-orphans || true
            
            # Pullaa uusimmat imaget
            $SECRETS_ENV sudo docker-compose -f docker-compose.prod.yml pull
            
            # Käynnistä uudet palvelut
            $SECRETS_ENV sudo docker-compose -f docker-compose.prod.yml up -d
            
            # Testi: Odota hetki ja tarkista /health endpoint
            echo "Running smoke test on http://localhost:8001/health"
            sleep 15 # Anna reilusti aikaa käynnistymiseen
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 3 http://localhost:8001/health || echo "000")
            
            if [ "$HTTP_CODE" != "200" ]; then
                echo "❌ Deployment FAILED: Frontend service is unhealthy. HTTP Code: $HTTP_CODE"
                # Näytä konttien tila ja frontendin logit debuggausta varten
                sudo docker-compose -f docker-compose.prod.yml ps
                sudo docker-compose -f docker-compose.prod.yml logs frontend 
                exit 1
            fi
            
            echo "✅ Deployment successful. Frontend responded with 200 OK. Reload Nginx on host."
            sudo systemctl reload nginx
