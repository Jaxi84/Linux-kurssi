version: "3.9"

services:
  app:
    # Oletetaan, että sovelluksesi koodi (server.js/app.py) ja Dockerfile ovat kansiossa ./app
    build:
      context: ./app
    container_name: cicd-app
    environment:
      # Tämä on sisäinen portti, jota Nginx (Docker-verkko) käyttää
      - PORT=8080
      - APP_ENV=production
      # LISÄÄ TÄHÄN TIETOKANTA-MUUTTUJAT
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_DATABASE=appdb
    
    # Expose tekee portin näkyväksi vain Dockerin sisäisessä verkossa
    expose:
      - "8080"
      
    healthcheck:
      # Varmista, että sovelluksessasi on /health endpoint
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: cicd-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: appdb
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # Persistentti data
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    
  nginx:
    image: nginx:1.27-alpine
    container_name: cicd-nginx
    depends_on:
      app:
        condition: service_healthy
    
    # KORJATTU PORTTI: Julkaistaan kontti-Nginx (portti 80) VM:n porttiin 32000
    # VM:n Nginx ohjaa portista 80 polusta /cicd/ tähän porttiin 32000.
    ports:
      - "32000:80"
      
    # Mapataan oma nginx.conf (joka sisältää app-konttiin ohjaavat asetukset)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  db_data:
