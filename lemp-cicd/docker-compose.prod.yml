version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: always
    volumes:
      - ./db/init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    networks:
      - lemp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME}/lemp-backend:latest
    restart: always
    expose: 
      - "5000" 
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lemp_network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME}/lemp-frontend:latest
    restart: always
    ports:
      - "8001:8080" 
    depends_on:
      backend:
        condition: service_started
    networks:
      - lemp_network
    
networks:
  lemp_network:
    driver: bridge

volumes:
  db_data:
